name: "Oracle Code GitHub Action"
description: "Run Oracle Code in GitHub Actions workflows"
branding:
  icon: "code"
  color: "orange"

inputs:
  model:
    description: "Model to use"
    required: true

  share:
    description: "Share the Oracle Code session (defaults to true for public repos)"
    required: false

  prompt:
    description: "Custom prompt to override the default prompt"
    required: false

runs:
  using: "composite"
  steps:
    - name: Install Oracle Code
      shell: bash
      run: curl -fsSL https://oracle-code.ai/install | bash

    - name: Run Oracle Code
      shell: bash
      id: run_oracle_code
      run: ocode github run
      env:
        MODEL: ${{ inputs.model }}
        SHARE: ${{ inputs.share }}
        PROMPT: ${{ inputs.prompt }}
