name: oracle-code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  oracle-code:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/ocode')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Run Oracle Code
        uses: scawful/oracle-code/github@latest
        env:
          OCODE_API_KEY: ${{ secrets.OCODE_API_KEY }}
          OCODE_PERMISSION: '{"bash": "deny"}'
        with:
          model: oracle-code/claude-haiku-4-5
